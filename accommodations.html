<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accommodations</title>
    <!-- Open Graph / social share preview -->
    <meta property="og:type" content="website">

    <meta property="og:url" content="https://dwlarson10.github.io/td_countdown/accommodations.html">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Accommodations — Larson Thanksgiving 2026">
    <meta name="twitter:description" content="Countdown to the takedown — plus the week's plan, accommodations, the potluck, and the Presentation Championships.">
    <meta name="twitter:image" content="https://dwlarson10.github.io/td_countdown/images/slaps.jpg">
    <style>
        :root {
            --bg1: #667eea; --bg2: #764ba2;
            --cream: #fff8ef; --ink: #3a2b1f; --muted: #8a7a6d;
            --amber: #f2b705; --pumpkin: #e07a3f; --cranberry: #c1352b;
            --line: rgba(58, 43, 31, 0.12);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%);
            background-attachment: fixed; color: var(--ink); min-height: 100vh;
            padding: 2rem 1rem 4rem;
        }
        .wrap { max-width: 820px; margin: 0 auto; }

        .hero { text-align: center; color: #fff; margin-bottom: 1.8rem; }
        .hero .eyebrow { text-transform: uppercase; letter-spacing: 3px; font-size: 0.8rem; font-weight: 600; opacity: 0.85; }
        .hero h1 { font-size: 2.6rem; font-weight: 800; line-height: 1.05; margin: 0.4rem 0; text-shadow: 0 3px 14px rgba(0,0,0,0.3); }
        .hero .sub { font-size: 1.05rem; font-weight: 300; opacity: 0.92; }
        .nav-links { margin-top: 1rem; display: flex; gap: 1.1rem; justify-content: center; flex-wrap: wrap; }
        .nav-links a { color: #fff; text-decoration: none; font-size: 0.9rem; opacity: 0.85; border-bottom: 1px dashed rgba(255,255,255,0.5); padding-bottom: 1px; }
        .nav-links a:hover { opacity: 1; }

        .section-label {
            color: #fff; text-transform: uppercase; letter-spacing: 2px;
            font-size: 0.85rem; font-weight: 700; opacity: 0.92; margin: 1.6rem 0 1rem;
        }
        .section-label:first-of-type { margin-top: 0.5rem; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 1.1rem; }

        /* Room cards (link to a room page) */
        .room {
            background: var(--cream); border-radius: 20px; overflow: hidden;
            box-shadow: 0 14px 36px rgba(0,0,0,0.22); text-decoration: none; color: var(--ink);
            display: flex; flex-direction: column; transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .room:hover { transform: translateY(-3px); box-shadow: 0 20px 44px rgba(0,0,0,0.3); }
        .thumb {
            aspect-ratio: 16 / 10; background: linear-gradient(135deg, #fdeccd, #f8d9a8);
            display: flex; align-items: center; justify-content: center; font-size: 3rem;
            background-size: cover; background-position: center;
        }
        .room-body { padding: 1rem 1.15rem 1.2rem; }
        .room-name { font-size: 1.2rem; font-weight: 800; }
        .room-who { font-size: 0.92rem; color: var(--muted); margin-top: 0.15rem; }
        .room-cta { margin-top: 0.7rem; font-size: 0.85rem; font-weight: 800; color: var(--cranberry); }

        /* Amenity cards */
        .amenity {
            background: var(--cream); border-radius: 20px; padding: 1.3rem 1.3rem 1.4rem;
            box-shadow: 0 14px 36px rgba(0,0,0,0.22);
        }
        .amenity .ic {
            width: 52px; height: 52px; border-radius: 15px; font-size: 1.7rem;
            display: flex; align-items: center; justify-content: center; margin-bottom: 0.7rem;
            background: linear-gradient(135deg, #fdeccd, #f8d9a8);
        }
        .amenity h3 { font-size: 1.2rem; font-weight: 800; }
        .amenity .when { font-size: 0.74rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--pumpkin); margin: 0.15rem 0 0.45rem; }
        .amenity p { font-size: 0.95rem; line-height: 1.45; color: var(--ink); }

        @media (max-width: 560px) { .hero h1 { font-size: 2rem; } }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="hero">
            <div class="eyebrow">Larson Thanksgiving · Philadelphia</div>
            <h1>Accommodations 🏡</h1>
            <div class="sub">Where you sleep — and everything that makes it home</div>
            <div class="nav-links">
                <a href="index.html">← the countdown</a>
                <a href="week.html">the week</a>
            </div>
        </div>

        <div class="section-label">🛏️ Where You're Staying</div>
        <div class="grid" id="rooms"></div>

        <div class="section-label">✨ House Amenities</div>
        <div class="grid" id="amenities"></div>
    </div>

    <script>
        const ROOMS = [
            { name: "Ben &amp; Family", who: "Ben, Sarah &amp; “King” James", href: 'room-ben.html',  folder: 'images/rooms/ben/',  emoji: '🛏️' },
            { name: "Dave &amp; Family", who: "Dave &amp; Ashlene",                href: 'room-dave.html', folder: 'images/rooms/dave/', emoji: '🛏️' },
            { name: "The Kids' Room",    who: "The kid crew · ages 7–17",       href: 'room-kids.html', folder: 'images/rooms/kids/', emoji: '🧸' }
        ];

        const AMENITIES = [
            { ic: '☕', name: 'Coffee Bar',       when: 'Every morning',  blurb: 'Fired up every morning — espresso, drip, and the fixings to build your perfect cup before the day gets going.' },
            { ic: '🍸', name: 'Nightly Cocktails', when: 'Each evening',   blurb: 'A fresh cocktail every evening once the kids wind down. A different pour each night — bartender\'s choice.' },
            { ic: '📺', name: 'New Girl Marathon', when: 'All week',       blurb: 'The big screen is running New Girl all week long. Grab a blanket, pile onto the couch, and settle in.' }
        ];

        function probe(src) {
            return new Promise(res => { const i = new Image(); i.onload = () => res(true); i.onerror = () => res(false); i.src = src; });
        }

        // ---- Rooms ----
        const roomsEl = document.getElementById('rooms');
        ROOMS.forEach(async r => {
            const a = document.createElement('a');
            a.className = 'room'; a.href = r.href;
            a.innerHTML = '<div class="thumb">' + r.emoji + '</div>'
                + '<div class="room-body">'
                + '<div class="room-name">' + r.name + '</div>'
                + '<div class="room-who">' + r.who + '</div>'
                + '<div class="room-cta">View room →</div>'
                + '</div>';
            roomsEl.appendChild(a);
            const first = r.folder + '1.jpg';
            if (await probe(first)) {
                const thumb = a.querySelector('.thumb');
                thumb.style.backgroundImage = 'url("' + first + '")';
                thumb.textContent = '';
            }
        });

        // ---- Amenities ----
        const amenEl = document.getElementById('amenities');
        AMENITIES.forEach(m => {
            const d = document.createElement('div');
            d.className = 'amenity';
            d.innerHTML = '<div class="ic">' + m.ic + '</div>'
                + '<h3>' + m.name + '</h3>'
                + '<div class="when">' + m.when + '</div>'
                + '<p>' + m.blurb + '</p>';
            amenEl.appendChild(d);
        });
    </script>
</body>
</html>
