<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Larson Philadelphia Takedown Countdown</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            position: relative;
            overflow: hidden;
            transition: background 1s ease-in-out;
        }

        body.slapsgiving-mode {
            background: url('images/slaps.jpg') center center / cover no-repeat;
        }

        body.slapsgiving-mode::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 0;
        }

        .slideshow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            transition: opacity 1s ease-in-out;
        }

        body.slapsgiving-mode .slideshow {
            opacity: 0;
            pointer-events: none;
        }

        .slideshow img {
            position: fixed;
            width: 350px;
            height: 250px;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            background: white;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border-radius: 2px;
            cursor: pointer;
        }

        .slideshow img.clickable {
            cursor: pointer;
        }

        .slideshow img.clickable:hover {
            transform: scale(1.05) !important;
            transition: transform 0.3s ease-in-out, opacity 1.5s ease-in-out;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
        }

        .slideshow img:nth-child(1) {
            top: 10%;
            left: 5%;
            transform: rotate(-8deg);
            z-index: 1;
        }

        .slideshow img:nth-child(2) {
            top: 15%;
            right: 8%;
            transform: rotate(5deg);
            z-index: 2;
        }

        .slideshow img:nth-child(3) {
            bottom: 15%;
            left: 10%;
            transform: rotate(4deg);
            z-index: 3;
        }

        .slideshow img:nth-child(4) {
            bottom: 20%;
            right: 5%;
            transform: rotate(-6deg);
            z-index: 4;
        }

        .slideshow img:nth-child(5) {
            top: 50%;
            left: 3%;
            transform: translateY(-50%) rotate(7deg);
            z-index: 5;
        }

        .slideshow img:nth-child(6) {
            top: 50%;
            right: 3%;
            transform: translateY(-50%) rotate(-5deg);
            z-index: 6;
        }

        .slideshow img:nth-child(7) {
            top: 5%;
            left: 50%;
            transform: translateX(-50%) rotate(3deg);
            z-index: 7;
        }

        .slideshow img:nth-child(8) {
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%) rotate(-4deg);
            z-index: 8;
        }

        .slideshow img:nth-child(n+9) {
            top: 30%;
            left: 15%;
            transform: rotate(-2deg);
            z-index: 9;
        }

        .slideshow img.active {
            opacity: 1;
        }

        .container {
            text-align: center;
            padding: 2rem;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 300;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.55);
        }

        .countdown {
            font-size: 8rem;
            font-weight: 700;
            line-height: 1;
            text-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .label {
            font-size: 1.5rem;
            font-weight: 300;
            margin-top: 1rem;
            opacity: 0.9;
        }

        .countdown-grid {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }

        .unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 90px;
        }

        .unit .num {
            font-size: 5rem;
            font-weight: 700;
            line-height: 1;
            text-shadow: 0 4px 6px rgba(0, 0, 0, 0.15);
            font-variant-numeric: tabular-nums;
        }

        .unit .unit-label {
            font-size: 1rem;
            font-weight: 300;
            margin-top: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.85;
        }

        .unit:first-child .num {
            color: #ffd86b;
        }

        .celebrate {
            font-size: 3rem;
            font-weight: 700;
            margin: 1rem 0;
        }

        .info-card {
            margin: 2.5rem auto 0;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: left;
        }

        .info-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.25rem;
        }

        .info-icon {
            font-size: 1.6rem;
            flex-shrink: 0;
            width: 2rem;
            text-align: center;
        }

        .info-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .info-sub {
            font-size: 0.9rem;
            opacity: 0.85;
            font-weight: 300;
        }

        .calendar-btn {
            width: 100%;
            margin-top: 0.25rem;
            padding: 0.9rem 1rem;
            font-size: 1rem;
            font-weight: 600;
            color: #764ba2;
            background: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
        }

        .calendar-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.5rem;
            }

            .countdown {
                font-size: 4rem;
            }

            .label {
                font-size: 1rem;
            }

            .unit .num {
                font-size: 3rem;
            }

            .unit {
                flex: 0 0 38%;
                min-width: 0;
            }

            .countdown-grid {
                gap: 1rem 0.5rem;
                max-width: 340px;
                margin-left: auto;
                margin-right: auto;
            }

            .info-card {
                max-width: 88%;
            }

            .celebrate {
                font-size: 1.8rem;
            }

            .slideshow img {
                width: 200px;
                height: 150px;
                padding: 10px;
            }

            .slideshow img:nth-child(1) {
                top: 5%;
                left: 2%;
            }

            .slideshow img:nth-child(2) {
                top: 5%;
                right: 2%;
            }

            .slideshow img:nth-child(3) {
                bottom: 5%;
                left: 2%;
            }

            .slideshow img:nth-child(4) {
                bottom: 5%;
                right: 2%;
            }

            .slideshow img:nth-child(5) {
                top: 40%;
                left: 2%;
            }

            .slideshow img:nth-child(6) {
                top: 40%;
                right: 2%;
            }
        }
    </style>
</head>
<body>
    <div class="slideshow" id="slideshow"></div>
    <div class="overlay"></div>
    <div class="container">
        <h1>Days Till Larson Philadelphia Takedown</h1>
        <div class="countdown-grid" id="countdownGrid">
            <div class="unit"><span class="num" id="days">-</span><span class="unit-label">days</span></div>
            <div class="unit"><span class="num" id="hours">-</span><span class="unit-label">hours</span></div>
            <div class="unit"><span class="num" id="minutes">-</span><span class="unit-label">minutes</span></div>
            <div class="unit"><span class="num" id="seconds">-</span><span class="unit-label">seconds</span></div>
        </div>
        <div class="celebrate" id="celebrate" style="display:none;">🦃 It's Thanksgiving! Happy Takedown! 🦃</div>

        <div class="info-card">
            <div class="info-row">
                <span class="info-icon">📅</span>
                <div>
                    <div class="info-title">Thursday, November 26, 2026</div>
                    <div class="info-sub">Dinner at 3:00 PM · get here whenever you want</div>
                </div>
            </div>
            <div class="info-row">
                <span class="info-icon">📍</span>
                <div>
                    <div class="info-title">Philadelphia, PA</div>
                    <div class="info-sub">Hosted by Dan this year · full address sent to family</div>
                </div>
            </div>
            <button class="calendar-btn" id="calendarBtn">＋ Add to Calendar</button>
        </div>
    </div>

    <script>
        // Set your target date here (YYYY, MM-1, DD) - month is 0-indexed
        const targetDate = new Date(2026, 10, 26, 0, 0, 0); // Thanksgiving 2026: November 26

        let isSlapsgivingMode = false;
        let slapsgivingStartTime = Date.now();

        function checkSlapsgivingToggle() {
            const timeSinceLastToggle = Date.now() - slapsgivingStartTime;
            const tenMinutes = 3 * 60 * 1000; // 10 minutes in milliseconds

            if (timeSinceLastToggle >= tenMinutes) {
                isSlapsgivingMode = !isSlapsgivingMode;
                slapsgivingStartTime = Date.now();

                if (isSlapsgivingMode) {
                    document.body.classList.add('slapsgiving-mode');
                    document.querySelector('h1').textContent = 'Slapsgiving Starts In';
                } else {
                    document.body.classList.remove('slapsgiving-mode');
                    document.querySelector('h1').textContent = 'Days Till Larson Philadelphia Takedown';
                }
            }
        }

        function updateCountdown() {
            const now = new Date();
            const difference = targetDate - now;

            if (difference > 0) {
                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference / (1000 * 60 * 60)) % 24);
                const minutes = Math.floor((difference / (1000 * 60)) % 60);
                const seconds = Math.floor((difference / 1000) % 60);
                document.getElementById('days').textContent = days.toLocaleString();
                document.getElementById('hours').textContent = String(hours).padStart(2, '0');
                document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
                document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
            } else {
                document.getElementById('countdownGrid').style.display = 'none';
                document.getElementById('celebrate').style.display = 'block';
            }
        }

        // Update immediately
        updateCountdown();

        // Check for slapsgiving toggle every 10 seconds
        setInterval(checkSlapsgivingToggle, 10000);

        // Update countdown every second so it ticks live
        setInterval(updateCountdown, 1000);

        // Add to Calendar — download an .ics file that works with Apple,
        // Google, and Outlook calendars. Times are local (America/New_York).
        const icsContent = [
            'BEGIN:VCALENDAR',
            'VERSION:2.0',
            'PRODID:-//Larson Takedown//Thanksgiving//EN',
            'CALSCALE:GREGORIAN',
            'BEGIN:VEVENT',
            'UID:larson-thanksgiving-2026@dwlarson10.github.io',
            'DTSTAMP:20260831T000000Z',
            'DTSTART:20261126T150000',
            'DTEND:20261126T190000',
            'SUMMARY:Larson Thanksgiving — Philadelphia',
            'LOCATION:Philadelphia, PA',
            'DESCRIPTION:Dinner at 3:00 PM. Get here whenever you want! Hosted by Dan in Philadelphia this year.',
            'END:VEVENT',
            'END:VCALENDAR'
        ].join('\r\n');

        document.getElementById('calendarBtn').addEventListener('click', function() {
            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'larson-thanksgiving-2026.ics';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        // Image Slideshow
        // Photos are auto-discovered: just drop numbered files into the images
        // folder (images/photo_1.jpg, images/photo_2.jpg, ...) and they show up.
        // No need to edit this file. Discovery stops at the first missing number.
        const slideshow = document.getElementById('slideshow');
        let currentIndex = 0;
        let images = [];

        // Set which image index should be clickable (0-based index)
        const clickableImageIndex = 4; // Change this to the image you want to be clickable

        // Probe images/photo_N.jpg starting at 1, stopping at the first gap.
        function probeImage(src) {
            return new Promise((resolve) => {
                const test = new Image();
                test.onload = () => resolve(true);
                test.onerror = () => resolve(false);
                test.src = src;
            });
        }

        async function discoverImages() {
            const found = [];
            let i = 1;
            // Cap the scan so a stray gap can never loop forever.
            while (i <= 500) {
                const src = `images/photo_${i}.jpg`;
                if (await probeImage(src)) {
                    found.push(src);
                    i++;
                } else {
                    break;
                }
            }
            return found;
        }

        function buildSlideshow(srcs) {
            images = srcs;
            srcs.forEach((src, index) => {
                const img = document.createElement('img');
                img.src = src;
                img.alt = 'Slideshow image';
                if (index === 0 || index === 1) {
                    img.classList.add('active');
                }

                // Make specific image clickable
                if (index === clickableImageIndex) {
                    img.classList.add('clickable');
                    img.addEventListener('click', function() {
                        window.location.href = 'video.html';
                    });
                }

                slideshow.appendChild(img);
            });

            // Change image every 5 seconds
            if (images.length > 0) {
                setInterval(nextImage, 5000);
            }
        }

        // Cycle through images - keep 2 visible at a time
        function nextImage() {
            if (images.length === 0) return;

            const allImages = slideshow.querySelectorAll('img');

            // Calculate which image to fade out (the oldest of the two currently visible)
            const oldestIndex = currentIndex === 0 ? images.length - 1 : currentIndex - 1;
            allImages[oldestIndex].classList.remove('active');

            // Move to next image and make it active
            currentIndex = (currentIndex + 1) % images.length;
            allImages[currentIndex].classList.add('active');
        }

        discoverImages().then(buildSlideshow);
    </script>
</body>
</html>
