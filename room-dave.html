    <style>
        :root {
            --bg1: #667eea; --bg2: #764ba2;
            --cream: #fff8ef; --ink: #3a2b1f; --muted: #8a7a6d;
            --amber: #f2b705; --pumpkin: #e07a3f; --cranberry: #c1352b; --leaf: #6a8f4f;
            --line: rgba(58, 43, 31, 0.12);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%);
            background-attachment: fixed; color: var(--ink); min-height: 100vh;
            padding: 2rem 1rem 4rem;
        }
        .wrap { max-width: 820px; margin: 0 auto; }

        .hero { text-align: center; color: #fff; margin-bottom: 1.5rem; }
        .hero .eyebrow { text-transform: uppercase; letter-spacing: 3px; font-size: 0.8rem; font-weight: 600; opacity: 0.85; }
        .hero h1 { font-size: 2.6rem; font-weight: 800; line-height: 1.05; margin: 0.4rem 0; text-shadow: 0 3px 14px rgba(0,0,0,0.3); }
        .hero .who { font-size: 1.1rem; font-weight: 300; opacity: 0.95; }
        .nav-links { margin-top: 1rem; display: flex; gap: 1.1rem; justify-content: center; flex-wrap: wrap; }
        .nav-links a { color: #fff; text-decoration: none; font-size: 0.9rem; opacity: 0.85; border-bottom: 1px dashed rgba(255,255,255,0.5); padding-bottom: 1px; }
        .nav-links a:hover { opacity: 1; }

        .card {
            background: var(--cream); border-radius: 20px; padding: 1.3rem 1.4rem;
            box-shadow: 0 14px 36px rgba(0,0,0,0.22); margin-bottom: 1.2rem;
        }
        .card h2 {
            font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1.5px;
            color: var(--pumpkin); margin-bottom: 0.9rem;
        }

        /* Amenities list (the room's gloriously random contents) */
        .items { list-style: none; }
        .items li {
            display: flex; gap: 0.7rem; align-items: baseline;
            padding: 0.55rem 0; border-bottom: 1px solid var(--line);
            font-size: 1.02rem; font-weight: 600;
        }
        .items li:last-child { border-bottom: none; }
        .items li::before {
            content: '✓'; color: var(--leaf); font-weight: 800; flex-shrink: 0;
        }

        /* Facts */
        .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 0.8rem; }
        .fact { display: flex; gap: 0.7rem; align-items: flex-start; }
        .fact .ic { font-size: 1.4rem; flex-shrink: 0; width: 1.9rem; text-align: center; }
        .fact .lbl { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 700; }
        .fact .val { font-size: 1rem; font-weight: 600; }
        .coming-soon { color: var(--muted); font-size: 0.95rem; }

        .notes li { margin: 0 0 0.5rem 1.1rem; font-size: 0.96rem; line-height: 1.4; }

        @media (max-width: 560px) { .hero h1 { font-size: 2rem; } }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="hero">
            <div class="eyebrow">Larson Thanksgiving · Where You're Staying</div>
            <h1 id="roomName">Dave &amp; Family's Room</h1>
            <div class="who" id="roomWho">Dave &amp; Ashlene · the Baltimore Larsons</div>
            <div class="nav-links">
                <a href="accommodations.html">← accommodations</a>
                <a href="week.html">the week</a>
                <a href="index.html">the countdown</a>
            </div>
        </div>

        <div class="card">
            <h2>Featured Amenities</h2>
            <ul class="items" id="items"></ul>
        </div>

        <div class="card">
            <h2>Good to Know</h2>
            <div id="facts"></div>
        </div>

        <div class="card" id="notesCard" hidden>
            <h2>Notes</h2>
            <ul class="notes" id="notes"></ul>
        </div>
    </div>

    <script>
        const ROOM = {
            items: [
                'Endless supply of dirty cups',
                'Banjo',
                '1/16-full perfume bottles',
                'Music theater books',
                'Impromptu a cappella singing (not when you ask for it)',
                'A ukulele, for when the banjo needs backup',
                'Playbills from every show ever attended',
                'Scented candles (decorative — never actually lit)'
            ],
            facts: [
                { ic: '🛏️', lbl: 'Beds', val: '1 queen bed' },
                { ic: '📍', lbl: 'Room', val: "Nola's room" }
            ],
            notes: [
                'Rose & Ellie are bunking downstairs in the basement with the rest of the kids.'
            ]
        };

        function renderItems() {
            const el = document.getElementById('items');
            if (!ROOM.items.length) {
                el.outerHTML = '<div class="coming-soon">A full inventory is coming soon.</div>';
                return;
            }
            ROOM.items.forEach(it => {
                const li = document.createElement('li');
                li.textContent = it;
                el.appendChild(li);
            });
        }

        function renderFacts() {
            const el = document.getElementById('facts');
            if (!ROOM.facts.length) {
                el.innerHTML = '<div class="coming-soon">Room details coming soon.</div>';
                return;
            }
            const grid = document.createElement('div');
            grid.className = 'facts';
            ROOM.facts.forEach(f => {
                const d = document.createElement('div');
                d.className = 'fact';
                d.innerHTML = '<div class="ic">' + f.ic + '</div><div><div class="lbl">' + f.lbl + '</div><div class="val">' + f.val + '</div></div>';
                grid.appendChild(d);
            });
            el.appendChild(grid);
        }

        function renderNotes() {
            if (!ROOM.notes.length) return;
            document.getElementById('notesCard').hidden = false;
            const ul = document.getElementById('notes');
            ROOM.notes.forEach(n => { const li = document.createElement('li'); li.textContent = n; ul.appendChild(li); });
        }

        renderItems();
        renderFacts();
        renderNotes();
    </script>
</body>
</html>
